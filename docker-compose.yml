  db:
    image: postgres:13
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    env_file:
      - .env
    networks:
      - web_network

#  mongo-db:
#    image: mongo:latest
#    networks:
#      - web_network
#    restart: always
#    ports:
#      - "27017:27017"
#    volumes:
#      - mongodb-data:/data/mongodb

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin4_container
    restart: always
    ports:
      - "8888:80"
    env_file:
      - .env
    volumes:
      - pgadmin-data:/var/lib/pgadmin

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.3
    env_file:
      - .env
    environment:
      discovery.type: single-node
      xpack.security.enabled: 'false'
      ES_JAVA_OPTS: -Xms256m -Xmx512m
      cluster.routing.allocation.disk.threshold_enabled: false

    ports:
      - "9200:9200"


    healthcheck:
      test: ["CMD", "curl", "-s", "-f", "-u", "elastic:password", "http://localhost:9200"]
      interval: 5s
      retries: 10
    networks:
      - web_network

  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.3
    depends_on:
      elasticsearch:
        condition: service_healthy
    ports:
      - "5601:5601"

    environment:
      SERVERNAME: kibana
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      ELASTICSEARCH_USERNAME: kibana_system
      ELASTICSEARCH_PASSWORD: password
    env_file:
      - .env

    healthcheck:
      test: ["CMD-SHELL", "curl -s -I http://localhost:5601 | grep -q 'HTTP/1.1 302 Found"]
      interval: 5s
      retries: 10
    networks:
      - web_network


  redis:
    image: redis:latest
    platform: linux/amd64
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD-SHELL", "redis-cli ping || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - redis_data:/data
    networks:
      - web_network

  redis-commander:
    image: rediscommander/redis-commander:latest
    platform: linux/amd64
    environment:
      - REDIS_HOSTS=local:redis:6379
    ports:
      - "8081:8081"
    depends_on:
      redis:
        condition: service_healthy

    networks:
      - web_network

volumes:
  postgres_data:
  pgadmin-data:
  mongodb-data:
  redis_data:

networks:
  web_network:
